name: Build & release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail on known high/critical vulnerabilities in anything that ships to users.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - run: npm run pack:extension
      - name: Checksums
        shell: pwsh
        run: |
          # -Include only filters when the path ends in \*
          $files = Get-ChildItem release/* -File -Include *.exe,*.zip
          if (-not $files) { throw 'No release files found to checksum' }
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      # Lets anyone verify a download was built here from this source:
      #   gh attestation verify Sentrix-Setup-x.y.z.exe --repo zion07740/sentrix
      - name: Build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/Sentrix-Setup-*.exe
            release/Sentrix-*-portable.exe
            release/Sentrix-extension-*.zip
      - name: Publish GitHub release (draft)
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/Sentrix-Setup-*.exe
            release/Sentrix-*-portable.exe
            release/Sentrix-extension-*.zip
            release/SHA256SUMS.txt
