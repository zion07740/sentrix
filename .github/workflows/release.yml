name: Build & release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - run: npm run pack:extension
      - name: Checksums
        shell: pwsh
        run: |
          # -Include only filters when the path ends in \*
          $files = Get-ChildItem release/* -File -Include *.exe,*.zip
          if (-not $files) { throw 'No release files found to checksum' }
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/Sentrix-Setup-*.exe
            release/Sentrix-*-portable.exe
            release/Sentrix-extension-*.zip
            release/SHA256SUMS.txt
