# Weekly pull requests for security and version updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      build-tools:
        patterns: ['electron-builder', 'electron-vite', 'vite', 'vitest', 'typescript', '@types/*', '@vitejs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
